<header class="chat-header">
  <span class="chat-header-avatar">
    <svg class="chat-header-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"
        fill="currentColor"
      />
    </svg>
  </span>

  <div class="chat-header-info">
    <div class="chat-header-top">
      <span class="chat-header-name">{{ nombreVisible() }}</span>
    </div>
    <span class="chat-header-subtitle">{{ subtitulo() }}</span>
  </div>

  @if (contacto()) {
    <button
      type="button"
      class="chat-header-eliminar"
      title="Eliminar conversación"
      aria-label="Eliminar conversación"
      (click)="eliminar.emit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Zm3 2v8h2v-8H9Zm4 0v8h2v-8h-2Z"
          fill="currentColor"
        />
      </svg>
      <span class="chat-header-eliminar-texto">Eliminar</span>
    </button>
  }
</header>
