<section class="chat">
  <app-chat-header
    [contacto]="contacto()"
    (eliminar)="eliminar.emit()"
  ></app-chat-header>
  <app-message-list [mensajes]="mensajes()" [cargando]="cargando()" [hayContacto]="contacto() !== null"></app-message-list>
  <app-message-input [habilitado]="puedeResponder()" (enviar)="enviar.emit($event)"></app-message-input>
</section>
